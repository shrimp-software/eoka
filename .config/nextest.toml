# Browser tests share one display and Chrome install, so each CI shard runs
# them one at a time. A retried pass is reported as FLAKY, not hidden.
[profile.ci]
test-threads = 1
retries = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
