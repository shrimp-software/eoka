[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only flag unmaintained crates we depend on directly; transitive ones
# (pin-utils via futures, unsafe-libyaml via serde_yaml) have no fix to take.
unmaintained = "workspace"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
