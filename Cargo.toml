[package]
name = "eoka"
version = "0.5.10"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Stealth browser automation for Rust. Puppeteer/Playwright alternative with anti-bot bypass."
keywords = ["puppeteer", "playwright", "headless", "selenium", "web-scraping"]
categories = ["web-programming", "development-tools::testing", "api-bindings"]
repository = "https://github.com/shrimp-software/eoka"
homepage = "https://github.com/shrimp-software/eoka"
documentation = "https://docs.rs/eoka"
readme = "README.md"
authors = ["cbxss"]
# Keep the published package lean: CI config and any example-generated
# screenshots don't belong in the crate tarball.
exclude = ["/.github", "*.png", "*.jpg", "*.jpeg"]

[dependencies]
# Async runtime (minimal features — net/io-util/rt needed for the async
# tokio-tungstenite reader task; no macros/rt-multi-thread)
tokio = { version = "1", features = ["process", "sync", "time", "net", "io-util", "rt"] }

# WebSocket transport (no TLS — CDP is always ws:// localhost)
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Binary patching
aho-corasick = "1"
memmap2 = "0.9"

# RNG (zero transitive deps)
fastrand = "2"

# Base64 for screenshots
base64 = "0.23"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Examples are auto-discovered from examples/*.rs — no explicit [[example]] tables needed.
