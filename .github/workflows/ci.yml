name: CI

on:
  pull_request:
    branches: [main, master]
    # labeled/unlabeled re-evaluate the downstream-breaking escape hatch.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue tests the exact commit that lands, so main is not
  # re-tested after merge.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets --locked -- -D warnings

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          toolchain: 1.85.0
      - run: cargo check --lib --all-features --locked

  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - run: cargo test --all-features --locked

  # Compile the browser tests once per OS; the shards only run them.
  browser-build:
    name: Browser build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache-key: browser
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest
      - run: cargo nextest archive --all-features --locked --archive-file nextest.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-${{ matrix.os }}
          path: nextest.tar.zst
          retention-days: 1

  browser:
    name: Browser (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: browser-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, shards: 3 }
          - { os: ubuntu-latest, shard: 2, shards: 3 }
          - { os: ubuntu-latest, shard: 3, shards: 3 }
          # macOS tests run against the runner's installed Google Chrome:
          # find_chrome() only looks in system locations there.
          - { os: macos-15, shard: 1, shards: 2 }
          - { os: macos-15, shard: 2, shards: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nextest-${{ matrix.os }}
      - name: Read the pinned Chrome for Testing version
        if: runner.os == 'Linux'
        run: echo "CHROME_VERSION=$(cat .github/chrome-version)" >> "$GITHUB_ENV"
      - name: Cache Chrome for Testing
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/eoka-chrome
          key: chrome-for-testing-linux64-${{ env.CHROME_VERSION }}
      - name: Install Chrome for Testing and Xvfb
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          apt=(sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          "${apt[@]}" update
          "${apt[@]}" install -y xvfb xauth libnss3 libatk-bridge2.0-0 libgbm1 libasound2t64
          dir="$RUNNER_TEMP/eoka-chrome"
          if [ ! -x "$dir/chrome-linux64/chrome" ]; then
            mkdir -p "$dir"
            curl --fail --location --retry 3 \
              "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip" \
              --output "$dir/chrome.zip"
            unzip -q "$dir/chrome.zip" -d "$dir"
            rm "$dir/chrome.zip"
          fi
          # Keep the launcher beside the ELF so the patcher finds Chrome's resources.
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/chrome" "$@"\n' > "$dir/chrome-linux64/google-chrome"
          chmod +x "$dir/chrome-linux64/google-chrome"
          sudo ln -sf "$dir/chrome-linux64/google-chrome" /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces, and the
          # unzipped Chrome for Testing has no setuid helper. Tests run with
          # the default (sandboxed) launch policy, so lift the restriction.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Show Chrome
        if: runner.os == 'macOS'
        run: |
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          codesign -d --entitlements - --xml "/Applications/Google Chrome.app" | plutil -p - || true
      - name: Run browser tests (shard ${{ matrix.shard }}/${{ matrix.shards }})
        shell: bash
        run: |
          set -euo pipefail
          filter='not test(/known_gap/)'
          # Keyboard dispatch on the hosted macOS runners is unreliable (focus
          # and attach_page behave differently there); both tests run on Linux.
          # Needs debugging on a real Mac.
          if [ "$RUNNER_OS" = macOS ]; then
            filter+=' and not test(=held_modifiers_shortcuts_and_prevent_default_preserve_native_semantics)'
            filter+=' and not test(=input::test_press_key)'
          fi
          run=(cargo nextest run --profile ci --archive-file nextest.tar.zst --workspace-remap .
            --run-ignored only --partition "hash:${{ matrix.shard }}/${{ matrix.shards }}"
            -E "$filter")
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${run[@]}"; else "${run[@]}"; fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-${{ matrix.os }}-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  downstream:
    name: Downstream eoka-tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shrimp-software/eoka-tools
          ref: main
          path: downstream
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          components: clippy
          workspaces: downstream
      - run: .github/scripts/downstream.sh downstream

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The only check branch protection requires. Skipped jobs pass; a PR
  # labelled downstream-breaking may merge with the downstream job red.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, msrv, unit, browser-build, browser, downstream, deny]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOW_DOWNSTREAM: ${{ contains(github.event.pull_request.labels.*.name, 'downstream-breaking') }}
        run: |
          failed=$(jq -r --arg allow "$ALLOW_DOWNSTREAM" 'to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"
                and (.key != "downstream" or $allow != "true")))
            | map("\(.key): \(.value.result)") | .[]' <<<"$NEEDS")
          if [ -n "$failed" ]; then echo "$failed"; exit 1; fi
          echo "All required jobs passed."

