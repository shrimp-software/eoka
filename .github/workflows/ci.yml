name: CI

on:
  pull_request:
    branches: [main, master]
    # labeled/unlabeled re-evaluate the downstream-breaking escape hatch.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets --locked -- -D warnings
      - name: Minimum Rust version (1.85)
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --lib --all-features --locked
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - run: cargo test --all-features --locked

  # Compile the browser tests once; the shards only run them.
  browser-build:
    name: Browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache-key: browser
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest
      - run: cargo nextest archive --all-features --locked --archive-file nextest.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest
          path: nextest.tar.zst
          retention-days: 1

  # Real Chrome for Testing (the pin in .github/chrome-version) on Linux.
  browser:
    name: Browser ${{ matrix.shard }}/2
    needs: browser-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest
      - run: echo "CHROME_VERSION=$(cat .github/chrome-version)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/eoka-chrome
          key: chrome-for-testing-linux64-${{ env.CHROME_VERSION }}
      - name: Install Chrome for Testing and Xvfb
        run: |
          set -euo pipefail
          apt=(sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          "${apt[@]}" update
          "${apt[@]}" install -y xvfb xauth libnss3 libatk-bridge2.0-0 libgbm1 libasound2t64
          dir="$RUNNER_TEMP/eoka-chrome"
          if [ ! -x "$dir/chrome-linux64/chrome" ]; then
            mkdir -p "$dir"
            curl --fail --location --retry 3 \
              "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip" \
              --output "$dir/chrome.zip"
            unzip -q "$dir/chrome.zip" -d "$dir"
            rm "$dir/chrome.zip"
          fi
          # Keep the launcher beside the ELF so the patcher finds Chrome's resources.
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/chrome" "$@"\n' > "$dir/chrome-linux64/google-chrome"
          chmod +x "$dir/chrome-linux64/google-chrome"
          sudo ln -sf "$dir/chrome-linux64/google-chrome" /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces, and the
          # unzipped Chrome for Testing has no setuid helper. Tests run with
          # the default (sandboxed) launch policy, so lift the restriction.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run browser tests
        run: |
          xvfb-run -a cargo nextest run --profile ci --archive-file nextest.tar.zst \
            --workspace-remap . --run-ignored only --partition "hash:${{ matrix.shard }}/2" \
            -E 'not test(/known_gap/)'
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  # Builds and tests eoka-tools main against this checkout.
  downstream:
    name: Downstream eoka-tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shrimp-software/eoka-tools
          ref: main
          path: downstream
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          components: clippy
          workspaces: downstream
      - run: .github/scripts/downstream.sh downstream

  # The only check branch protection requires. A PR labelled
  # downstream-breaking may merge with the downstream job red.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, unit, browser-build, browser, downstream]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOW_DOWNSTREAM: ${{ contains(github.event.pull_request.labels.*.name, 'downstream-breaking') }}
        run: |
          failed=$(jq -r --arg allow "$ALLOW_DOWNSTREAM" 'to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"
                and (.key != "downstream" or $allow != "true")))
            | map("\(.key): \(.value.result)") | .[]' <<<"$NEEDS")
          if [ -n "$failed" ]; then echo "$failed"; exit 1; fi
          echo "All required jobs passed."
